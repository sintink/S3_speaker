name: Build & Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Cache core & libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Setup ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson@7.0.4"
          arduino-cli lib install --git-url https://github.com/schreibfaul1/ESP32-audioI2S

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_16MB,CDCOnBoot=cdc" \
            --warnings none \
            --output-dir build \
            .

      - name: Prepare firmware
        run: |
          VERSION=$(grep -oP 'FW_VERSION\s+"\K[^"]+' S3_Speaker.ino)
          echo "FW_VERSION=$VERSION" >> $GITHUB_ENV
          ls -la build/
          cp build/*.ino.bin build/firmware.bin
          cp build/*.ino.bin "build/firmware-$VERSION.bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.FW_VERSION }}
          path: |
            build/firmware.bin
            build/firmware-${{ env.FW_VERSION }}.bin

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/firmware.bin
          generate_release_notes: true
